spring.application.name=sistema-clima
server.port=8080

# ==========================================
# DB - Configuración dinámica (Nube : Local)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/climatizacion_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA
# ==========================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# Email
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=467
spring.mail.username=alextejada025@gmail.com
# Usa la contraseña de entorno en Render, y la tuya de aplicación en local
spring.mail.password=${GMAIL_PASSWORD:rzlupzgzherhlaom}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Timeouts para evitar bloqueos largos
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# ==========================================
# Frontend
# ==========================================
frontend.url=${FRONTEND_URL:http://localhost:5500}

# ==========================================
# OPTIMIZACIÓN Y LIMPIEZA DE LOGS
# ==========================================
spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false

# Cloudinary
cloudinary.url=${CLOUDINARY_URL}
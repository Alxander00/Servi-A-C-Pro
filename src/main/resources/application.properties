spring.application.name=sistema-clima
server.port=8080

# DB - PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/climatizacion_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=trace
logging.level.org.hibernate.orm.jdbc.bind=WARN
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Frontend
frontend.url=${FRONTEND_URL:http://localhost:5500}

# Cloudinary
cloudinary.url=${CLOUDINARY_URL}

# Resend
resend.api.key=${RESEND_API_KEY:dummy_key_for_local_development}

# JWT
jwt.secret=+T/u5wL9n5f2G7kE3vR8wJ6tX4bH2mP9sL1kD5fG7hJ3=
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Perfil activo (por defecto desarrollo)
spring.profiles.active=dev